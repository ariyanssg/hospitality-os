<!DOCTYPE html>
<html lang="en">
<head>

<style>

    const { GuestCard, RoomStatusChip, ReservationStatusBadge } = window.AtriumVelaDesignSystem_ec9d90;
    function Demo() {
      return (
        <div>
          <GuestCard name="Priya Patel" vip

            traits={["3rd stay","prefers high floor","allergy: nuts","late checkout"]}

            <ReservationStatusBadge status="tentative" />

            <ReservationStatusBadge status="checked_out" />

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);

</html>
