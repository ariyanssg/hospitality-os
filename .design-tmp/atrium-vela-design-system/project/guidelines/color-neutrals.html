<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — warm graphite" subtitle="Hue-shifted warm graphite, not Tailwind gray · 90% of every screen" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg-surface); color: var(--ink-primary); padding: 20px 24px; font-family: var(--font-ui); }
  .ramp { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--line-hairline); }
  .sw { flex: 1; height: 64px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-family: var(--font-mono); font-size: 10px; }
  .cap { margin-top: 10px; font-size: 12px; color: var(--ink-tertiary); }
</style>
</head>
<body>
  <div class="ramp" id="ramp"></div>
  <div class="cap">graphite-0 → graphite-1000 · chroma 0.003–0.015 toward hue 250–264 (warm)</div>
  <script>
    const steps = [0,50,100,200,300,400,500,600,700,800,900,1000];
    document.getElementById('ramp').innerHTML = steps.map(s => {
      const light = s <= 400;
      return `<div class="sw" style="background:var(--graphite-${s});color:${light ? 'var(--graphite-900)' : 'var(--graphite-0)'}">${s}</div>`;
    }).join('');
  </script>
</body>
</html>
