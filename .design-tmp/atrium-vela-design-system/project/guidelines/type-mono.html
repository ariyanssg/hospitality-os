<!-- @dsCard group="Type" viewport="700x170" name="Mono — JetBrains Mono" subtitle="IDs, confirmation codes, money in ledgers · tabular" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg-surface); color: var(--ink-primary); padding: 22px 26px; font-family: var(--font-mono); }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .line { display: flex; align-items: baseline; gap: 16px; font-variant-numeric: tabular-nums; }
  .label { font-family: var(--font-ui); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-tertiary); width: 120px; }
  .neg { color: var(--fin-refund); }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="label">Confirmation</span><span>BK-1042</span></div>
    <div class="line"><span class="label">Folio</span><span>F-1008</span></div>
    <div class="line"><span class="label">Amount</span><span>$1,260.00</span></div>
    <div class="line"><span class="label">Refund</span><span class="neg">&minus;$65.00</span></div>
  </div>
</body>
</html>
