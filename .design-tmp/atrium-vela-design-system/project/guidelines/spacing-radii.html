<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="xs 4 · sm 6 · md 8 · lg 12 · xl 16 · full" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg-surface); color: var(--ink-primary); padding: 20px 24px; font-family: var(--font-ui); }
  .row { display: flex; align-items: flex-end; gap: 20px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 64px; height: 56px; background: var(--bg-sunken); border: 1px solid var(--line-strong); border-top: 3px solid var(--accent-600); }
  .num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-tertiary); }
</style>
</head>
<body>
  <div class="row" id="r"></div>
  <script>
    const steps = [['xs','4'],['sm','6'],['md','8'],['lg','12'],['xl','16'],['full','pill']];
    document.getElementById('r').innerHTML = steps.map(([k,px]) =>
      `<div class="col"><span class="box" style="border-radius:var(--radius-${k})"></span><span class="num">${k} · ${px}</span></div>`).join('');
  </script>
</body>
</html>
