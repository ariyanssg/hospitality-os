<!-- @dsCard group="Type" viewport="700x230" name="UI text — Inter" subtitle="The operational workhorse · ss01 + tabular numerals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg-surface); color: var(--ink-primary); padding: 22px 26px; font-family: var(--font-ui); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .line { display: flex; align-items: baseline; gap: 12px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-tertiary); margin-left: auto; }
  .caps { text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px; font-weight: 600; color: var(--ink-tertiary); }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span style="font-size:18px;font-weight:600">Heading — Needs attention</span><span class="meta">heading 18/28 · 600</span></div>
    <div class="line"><span style="font-size:16px">Body large — guest-facing reading surface</span><span class="meta">body-lg 16/24</span></div>
    <div class="line"><span style="font-size:14px;color:var(--ink-secondary)">Body — the UI default for every staff screen and table cell</span><span class="meta">body 14/20</span></div>
    <div class="line"><span style="font-size:12px;color:var(--ink-tertiary)">Caption — secondary metadata and helper text</span><span class="meta">caption 12/16</span></div>
    <div class="line"><span class="caps">Micro caps — section label</span><span class="meta">micro 11/14</span></div>
  </div>
</body>
</html>
