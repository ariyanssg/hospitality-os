<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base · component internals on 4, layout on 8" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg-surface); color: var(--ink-primary); padding: 20px 24px; font-family: var(--font-ui); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--accent-500); border-radius: 2px; width: 100%; }
  .num { font-family: var(--font-mono); font-size: 10px; color: var(--ink-tertiary); }
</style>
</head>
<body>
  <div class="row" id="r"></div>
  <script>
    const steps = [[1,'4'],[2,'8'],[3,'12'],[4,'16'],[5,'20'],[6,'24'],[8,'32'],[10,'40'],[12,'48'],[16,'64']];
    document.getElementById('r').innerHTML = steps.map(([s,px]) =>
      `<div class="col" style="width:${10+s*3}px"><span class="bar" style="height:var(--space-${s})"></span><span class="num">${px}</span></div>`).join('');
  </script>
</body>
</html>
