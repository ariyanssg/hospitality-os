packages:
  - apps/*
  - packages/*

# Centralized version catalog — every workspace references `catalog:` so the
# whole monorepo upgrades in one place (doc 14 §1).
catalog:
  # --- core toolchain ---
  typescript: ^5.7.3
  tsx: ^4.19.2
  tsup: ^8.3.5
  zod: ^3.24.1
  '@types/node': ^22.10.5

  # --- backend (NestJS + Fastify) ---
  '@nestjs/common': ^11.0.1
  '@nestjs/core': ^11.0.1
  '@nestjs/platform-fastify': ^11.0.1
  '@nestjs/config': ^4.0.0
  '@nestjs/testing': ^11.0.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1
  fastify: ^5.2.1

  # --- data layer ---
  drizzle-orm: ^0.38.3
  drizzle-kit: ^0.30.1
  postgres: ^3.4.5
  ioredis: ^5.4.2
  bullmq: ^5.34.5

  # --- auth ---
  better-auth: ^1.1.14

  # --- frontend (Next.js) ---
  next: ^15.1.4
  react: ^19.0.0
  react-dom: ^19.0.0
  '@types/react': ^19.0.4
  '@types/react-dom': ^19.0.2
  '@tanstack/react-query': ^5.64.1
  '@tanstack/react-table': ^8.20.6
  '@tanstack/react-virtual': ^3.11.2
  zustand: ^5.0.3
  react-hook-form: ^7.54.2
  '@hookform/resolvers': ^3.10.0

  # --- design system ---
  tailwindcss: ^4.0.0
  '@tailwindcss/postcss': ^4.0.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^2.6.0
  lucide-react: ^0.469.0

  # --- testing ---
  vitest: ^2.1.8
  fast-check: ^3.23.2
  '@testcontainers/postgresql': ^10.16.0
  testcontainers: ^10.16.0
